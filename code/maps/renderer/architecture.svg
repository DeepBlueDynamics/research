<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="870" viewBox="0 0 1600 435"><title>SEXTANT aboard alert path and ashore development workflow</title><desc>Exactly one active cross-panel arrow carries compiled artifacts from ashore to aboard. A crossed out return arrow means nothing trains or updates aboard.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#264c61"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#143447}.title{font-size:23px;font-weight:bold}.label{font-size:16px}.small{font-size:13px}.box{fill:#f5f9fb;stroke:#8ca8b8;stroke-width:1.5}.flow{fill:none;stroke:#264c61;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:5 4}</style><rect width="1600" height="435" fill="white"/><rect x="8" y="8" width="902" height="419" rx="7" fill="#f0f6f9" stroke="#28546c" stroke-width="3"/><rect x="938" y="8" width="654" height="419" rx="7" fill="#f4f7f3" stroke="#728b72" stroke-width="2"/><text x="25" y="38" class="title">ABOARD · DETERMINISTIC ALERT PATH</text><text x="25" y="62" class="label">air-gapped — no external requests</text><rect x="522" y="19" width="367" height="34" rx="4" fill="#dbece0"/><text x="534" y="42" class="label" font-weight="bold">no generative model on this path</text><text x="957" y="38" class="title">ASHORE · DEVELOPMENT &amp; EVALUATION</text><rect class="box" x="25" y="83" width="150" height="55" rx="4"/><text x="100" y="106" text-anchor="middle" class="label">SOURCES</text><text x="100" y="125" text-anchor="middle" class="label">3–8 @ 1–10 Hz</text><rect class="box" x="205" y="83" width="150" height="55" rx="4"/><text x="280" y="106" text-anchor="middle" class="label">Validated</text><text x="280" y="125" text-anchor="middle" class="label">ingest / bus</text><rect class="box" x="385" y="83" width="185" height="55" rx="4"/><text x="477.5" y="106" text-anchor="middle" class="label">Telemetry frame +</text><text x="477.5" y="125" text-anchor="middle" class="label">situation vector</text><rect class="box" x="600" y="83" width="130" height="55" rx="4"/><text x="665" y="106" text-anchor="middle" class="label">Rule</text><text x="665" y="125" text-anchor="middle" class="label">evaluation</text><rect class="box" x="760" y="83" width="129" height="55" rx="4"/><text x="824.5" y="115.5" text-anchor="middle" class="label">Anomaly key</text><path d="M175 110H202" class="flow"/><path d="M355 110H382" class="flow"/><path d="M570 110H597" class="flow"/><path d="M730 110H757" class="flow"/><rect class="box" x="650" y="161" width="239" height="55" rx="4" style="fill:#e1eee6"/><text x="769.5" y="184" text-anchor="middle" class="label">Exact lookup</text><text x="769.5" y="203" text-anchor="middle" class="label">SIGNED TOOL REGISTRY</text><path d="M824 138V158" class="flow"/><rect class="box" x="416" y="161" width="191" height="55" rx="4"/><text x="511.5" y="184" text-anchor="middle" class="label">Fallback:</text><text x="511.5" y="203" text-anchor="middle" class="label">vector search</text><path d="M650 188H610" class="flow"/><rect class="box" x="170" y="161" width="205" height="55" rx="4"/><text x="272.5" y="184" text-anchor="middle" class="label">Analogue or</text><text x="272.5" y="203" text-anchor="middle" class="label">INDETERMINATE</text><path d="M416 188H378" class="flow"/><rect class="box" x="420" y="242" width="187" height="48" rx="4"/><text x="513.5" y="271" text-anchor="middle" class="label">Prerequisite check</text><path d="M770 216V229H514V239" class="flow"/><path d="M273 216V266H417" class="flow"/><rect class="box" x="651" y="242" width="238" height="48" rx="4"/><text x="770" y="271" text-anchor="middle" class="label">Display + protected audit</text><path d="M607 266H648" class="flow"/><rect x="25" y="315" width="864" height="76" rx="5" fill="white" stroke="#7293a5" stroke-dasharray="6 4"/><text x="40" y="340" class="label" font-weight="bold">DRILL-DOWN · on demand — off alert path</text><text x="40" y="365" class="label">LEXICAL | GRAPH | DENSE over runbooks · optional local-LLM prose</text><path d="M770 290V312" class="flow dash"/><rect class="box" x="957" y="62" width="315" height="54" rx="4"/><text x="1114.5" y="84.5" text-anchor="middle" class="label">Simulated sensor data</text><text x="1114.5" y="103.5" text-anchor="middle" class="label">Skiff + fixtures</text><rect class="box" x="957" y="135" width="315" height="49" rx="4"/><text x="1114.5" y="164.5" text-anchor="middle" class="label">Scenario synthesis</text><path d="M1114 116V132" class="flow"/><rect class="box" x="1310" y="89" width="262" height="88" rx="4" style="fill:#fff1d8"/><text x="1441" y="119" text-anchor="middle" class="label">EVALUATOR-HELD TRUTH</text><text x="1441" y="138" text-anchor="middle" class="label">Separate vault</text><text x="1441" y="157" text-anchor="middle" class="label">Hidden from rule drafting</text><path d="M1272 157H1290V132H1310" fill="none" stroke="#8b6e37" stroke-dasharray="5 4"/><rect class="box" x="957" y="204" width="615" height="53" rx="4"/><text x="1264.5" y="235.5" text-anchor="middle" class="label">Local LLMs draft cited rules / bindings / tests</text><path d="M1114 184V201" class="flow"/><rect class="box" x="957" y="278" width="180" height="46" rx="4"/><text x="1047" y="306" text-anchor="middle" class="label">Human review</text><path d="M1114 257V270H1047V275" class="flow"/><rect class="box" x="1170" y="278" width="402" height="46" rx="4" style="fill:#e1eee6"/><text x="1371" y="306" text-anchor="middle" class="label">Compile &amp; freeze: manifests, indices, registry</text><path d="M1137 301H1167" class="flow"/><rect class="box" x="1167" y="348" width="405" height="44" rx="4"/><text x="1369.5" y="375" text-anchor="middle" class="label">Versioned regression loop</text><path d="M1372 324V345" class="flow"/><path d="M1558 348V191H1290V159H1275" class="flow"/><text x="1190" y="417" class="small">train/val/eval split by family + seed</text><path d="M1170 301H1152V402H924V188H892" class="flow"/><rect x="888" y="325" width="270" height="22" fill="white"/><text x="900" y="341" class="small" font-weight="bold">← compiled artifacts only</text><path d="M869 409H1128" fill="none" stroke="#b25549" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M1120 404L1128 409L1120 414M918 401L932 417M918 417L932 401" fill="none" stroke="#b25549" stroke-width="2"/><text x="608" y="416" class="small">nothing trains or updates aboard</text></svg>