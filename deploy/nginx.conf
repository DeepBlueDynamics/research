server {
    listen 8080;               # Cloud Run default PORT
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    # long cache for the immutable card, no-cache for the html
    location = /og-card.png { add_header Cache-Control "public, max-age=86400"; }
    location = /index.html  { add_header Cache-Control "no-cache"; }
}
